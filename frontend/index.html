<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
            width: 100%;
            max-width: 560px;
            padding: 32px;
            height: fit-content;
        }
        h1 { font-size: 28px; margin-bottom: 24px; color: #333; text-align: center; }
        .input-row { display: flex; gap: 8px; margin-bottom: 24px; }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color .2s;
        }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background .2s;
        }
        button:hover { background: #5568d3; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        ul { list-style: none; }
        li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            animation: fadeIn .2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        li:last-child { border-bottom: none; }
        li.completed .title { text-decoration: line-through; color: #aaa; }
        .checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #667eea; }
        .title { flex: 1; font-size: 16px; color: #333; word-break: break-word; }
        .delete-btn {
            background: transparent;
            color: #e74c3c;
            padding: 4px 10px;
            font-size: 20px;
            line-height: 1;
        }
        .delete-btn:hover { background: #fee; }
        .empty { text-align: center; color: #999; padding: 32px 0; font-style: italic; }
        .error {
            background: #fee;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Todo App</h1>
        <div id="error" class="error" style="display:none;"></div>
        <div class="input-row">
            <input type="text" id="newTodo" placeholder="Что нужно сделать?" maxlength="255">
            <button id="addBtn">Добавить</button>
        </div>
        <ul id="todoList"></ul>
        <div id="empty" class="empty" style="display:none;">Пока нет задач. Добавьте первую!</div>
    </div>

    <script>
        const API = '/api/todos';
        const listEl = document.getElementById('todoList');
        const emptyEl = document.getElementById('empty');
        const errorEl = document.getElementById('error');
        const inputEl = document.getElementById('newTodo');
        const addBtn = document.getElementById('addBtn');

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 4000);
        }

        async function apiFetch(url, options = {}) {
            const res = await fetch(url, {
                headers: { 'Content-Type': 'application/json' },
                ...options
            });
            if (!res.ok) {
                const text = await res.text();
                throw new Error(`HTTP ${res.status}: ${text}`);
            }
            if (res.status === 204) return null;
            return res.json();
        }

        function renderTodos(todos) {
            listEl.innerHTML = '';
            if (todos.length === 0) {
                emptyEl.style.display = 'block';
                return;
            }
            emptyEl.style.display = 'none';

            todos.forEach(todo => {
                const li = document.createElement('li');
                if (todo.completed) li.classList.add('completed');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.onchange = () => toggleTodo(todo.id, checkbox.checked);

                const title = document.createElement('span');
                title.className = 'title';
                title.textContent = todo.title;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '×';
                delBtn.title = 'Удалить';
                delBtn.onclick = () => deleteTodo(todo.id);

                li.append(checkbox, title, delBtn);
                listEl.appendChild(li);
            });
        }

        async function loadTodos() {
            try {
                const todos = await apiFetch(API);
                renderTodos(todos);
            } catch (e) {
                showError('Не удалось загрузить задачи: ' + e.message);
            }
        }

        async function addTodo() {
            const title = inputEl.value.trim();
            if (!title) return;
            addBtn.disabled = true;
            try {
                await apiFetch(API, {
                    method: 'POST',
                    body: JSON.stringify({ title })
                });
                inputEl.value = '';
                await loadTodos();
            } catch (e) {
                showError('Ошибка при добавлении: ' + e.message);
            } finally {
                addBtn.disabled = false;
                inputEl.focus();
            }
        }

        async function toggleTodo(id, completed) {
            try {
                await apiFetch(`${API}/${id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ completed })
                });
                await loadTodos();
            } catch (e) {
                showError('Ошибка обновления: ' + e.message);
            }
        }

        async function deleteTodo(id) {
            try {
                await apiFetch(`${API}/${id}`, { method: 'DELETE' });
                await loadTodos();
            } catch (e) {
                showError('Ошибка удаления: ' + e.message);
            }
        }

        addBtn.onclick = addTodo;
        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') addTodo();
        });

        loadTodos();
    </script>
</body>
</html>
